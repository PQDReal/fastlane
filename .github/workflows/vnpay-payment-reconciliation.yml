name: Reconcile pending VNPay payments

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vnpay-payment-reconciliation
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reconcile overdue payment attempts
        env:
          APP_BASE_URL: ${{ secrets.FASTLANE_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CONTRACT_EXPIRY_CRON_SECRET }}
        run: |
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/v1/payments/vnpay/reconcile"
