services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
    image: fastlane-web:local
    init: true
    restart: unless-stopped
    env_file: "${FASTLANE_ENV_FILE:-.env.local}"
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FASTLANE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  swagger:
    image: swaggerapi/swagger-ui:v5.32.6
    init: true
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /contract/openapi.bundle.yaml
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8080}:8080"
    volumes:
      - ./api-contract/dist/openapi.bundle.yaml:/contract/openapi.bundle.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
