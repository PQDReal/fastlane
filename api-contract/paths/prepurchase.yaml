      '422': { $ref: '../openapi.yaml#/components/responses/PrepurchaseBusinessRuleError' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }

/estimates/on-road:
  post:
    tags: [Pre-purchase]
    operationId: calculateOnRoadEstimate
    x-prd-references: [BR-EST-001, BR-EST-002, BR-EST-003, BR-EST-004, BR-EST-005, BR-EST-007, BR-EST-010, BR-EST-011, BR-EST-012]
    summary: Calculate a public on-road cost estimate
    description: |
      Calculates authoritative catalog price plus options minus one eligible promotion, then adds effective mandatory and selected optional fee policies for the registration province.
      VAT is never added twice. A missing mandatory policy fails the calculation instead of silently using zero. The result is advisory, versioned, and is not a quotation.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OnRoadEstimateRequest' }
    responses:
      '200': { $ref: '../openapi.yaml#/components/responses/OnRoadEstimate' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '422': { $ref: '../openapi.yaml#/components/responses/EstimateUnavailable' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }

/estimates/installment:
  post:
    tags: [Pre-purchase]
    operationId: calculateInstallmentEstimate
    x-prd-references: [BR-LN-001, BR-LN-003, BR-LN-004, BR-LN-005, BR-LN-006, BR-LN-007]
    summary: Calculate an advisory declining-balance installment schedule
    description: |
      The finance base is the vehicle price after discount from the referenced current on-road calculation; registration and optional fees remain due up front.
      MVP uses equal principal, monthly interest on opening principal, whole-VND half-up rounding, and a final-period principal reconciliation. The result is not credit approval.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/InstallmentEstimateRequest' }
    responses:
      '200': { $ref: '../openapi.yaml#/components/responses/InstallmentEstimate' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '409': { $ref: '../openapi.yaml#/components/responses/EstimateConflict' }
      '422': { $ref: '../openapi.yaml#/components/responses/EstimateUnavailable' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }

