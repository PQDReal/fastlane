/test-drive/availability:
  get:
    tags: [Pre-purchase]
    operationId: getTestDriveAvailability
    x-prd-references: [BR-TD-005, BR-TD-006, BR-SHW-004]
    summary: List available test-drive slots for the single configured location
    description: The location is server-owned and returned with the slots. The client supplies a product but never selects or submits a showroom identifier. REQUESTED records do not consume capacity; only CONFIRMED appointments do.
    security: []
    parameters:
      - { $ref: '../openapi.yaml#/components/parameters/ProductIdQuery' }
      - { $ref: '../openapi.yaml#/components/parameters/DateFrom' }
      - { $ref: '../openapi.yaml#/components/parameters/DateTo' }
    responses:
      '200': { $ref: '../openapi.yaml#/components/responses/TestDriveAvailability' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '422': { $ref: '../openapi.yaml#/components/responses/PrepurchaseBusinessRuleError' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }

/test-drive/requests:
  post:
    tags: [Pre-purchase]
    operationId: createTestDriveRequest
    x-prd-references: [BR-TD-001, BR-TD-002, BR-TD-004, BR-TD-007, BR-TD-008, BR-TD-009, BR-TD-017]
    summary: Request a preferred test-drive time as a guest or customer
    description: |
      Creates REQUESTED, not CONFIRMED. The server revalidates the one configured location, supported product, slot, blackout, and current confirmed capacity.
      The same normalized phone, product, and local date cannot have another active REQUESTED or CONFIRMED request. No driving-licence or identity-document image is accepted.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/CreateTestDriveRequest' }
    responses:
      '201': { $ref: '../openapi.yaml#/components/responses/TestDriveRequest' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '409': { $ref: '../openapi.yaml#/components/responses/TestDriveConflict' }
      '422': { $ref: '../openapi.yaml#/components/responses/PrepurchaseBusinessRuleError' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }

/consultation-requests:
  post:
    tags: [Pre-purchase]
    operationId: createConsultationRequest
    x-prd-references: [BR-LEAD-001, BR-LEAD-002, BR-LEAD-003]
    summary: Submit a pre-purchase consultation request
    description: Guest access is allowed. Product and option identifiers carry context only; the server never trusts a client-supplied price or discount.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/CreateConsultationRequest' }
    responses:
