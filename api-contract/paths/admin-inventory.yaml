/admin/inventory/query:
  get:
    tags: [Admin Catalog]
    operationId: queryAdminInventory
    x-prd-references: [US-A04, FR-ADMN-04, BR-05]
    summary: Query inventory with normalized filters and cursor pagination
    description: |
      New additive inventory query contract backed by the admin inventory read model.
      The legacy /api/v1/admin/inventory response remains unchanged while the admin
      screen migrates to this endpoint. Search is accent-insensitive and cursor is opaque.
    security: [{ bearerAuth: [] }]
    x-required-roles: [admin]
    x-required-permissions: [inventory:manage]
    parameters:
      - name: search
        in: query
        schema: { type: string, maxLength: 160 }
      - name: productType
        in: query
        schema: { type: string, enum: [ALL, CAR, BIKE, ACCESSORY], default: ALL }
      - name: productId
        in: query
        schema: { oneOf: [{ $ref: '../openapi.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
      - name: variant
        in: query
        schema: { type: string, maxLength: 160 }
      - name: color
        in: query
        schema: { type: string, maxLength: 160 }
      - name: interiorColor
        in: query
        schema: { type: string, maxLength: 160 }
      - name: status
        in: query
        schema: { type: string, enum: [ALL, INACTIVE, UNLINKED, MISSING_INVENTORY, OUT_OF_STOCK, LOW_STOCK, IN_STOCK], default: ALL }
      - name: activity
        in: query
        schema: { type: string, enum: [ALL, ACTIVE, INACTIVE], default: ALL }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: cursor
        in: query
        description: Opaque cursor returned by the previous response.
        schema: { type: string, maxLength: 4096 }
      - name: includeFilterOptions
        in: query
        description: Defaults to true for backward compatibility. The admin screen sets false and loads stable filter metadata separately.
        schema: { type: boolean, default: true }
    responses:
      '200':
        description: Cursor-paginated inventory query
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/AdminInventoryQueryResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }

/admin/inventory/filter-options:
  get:
    tags: [Admin Catalog]
    operationId: getAdminInventoryFilterOptions
    x-prd-references: [US-A04, FR-ADMN-04, BR-05]
    summary: Load inventory filter metadata independently from cursor pages
    description: Called only when product type or product changes, so cursor and status changes do not repeat the metadata RPC.
    security: [{ bearerAuth: [] }]
    x-required-roles: [admin]
    x-required-permissions: [inventory:manage]
    parameters:
      - name: productType
        in: query
        schema: { type: string, enum: [ALL, CAR, BIKE, ACCESSORY], default: ALL }
      - name: productId
        in: query
        schema: { oneOf: [{ $ref: '../openapi.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
    responses:
      '200':
        description: Product, variant and color options for inventory filters
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/AdminInventoryFilterOptionsResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }
