/admin/products:
  get:
    tags: [Admin Catalog]
    operationId: listAdminProducts
    x-prd-references: [US-A02, US-A08, FR-ADMN-02, FR-ADMN-03]
    summary: List products for administration
    description: Search includes active and inactive products. sort=relevance requires q; when sort is omitted, q uses relevance then product ID and an empty q uses newest then product ID.
    security: [{ bearerAuth: [] }]
    x-required-roles: [admin]
    x-required-permissions: [catalog:manage]
    parameters:
      - { $ref: '../openapi.yaml#/components/parameters/Query' }
      - { $ref: '../openapi.yaml#/components/parameters/CategoryIdFilter' }
      - { $ref: '../openapi.yaml#/components/parameters/IsActive' }
      - { $ref: '../openapi.yaml#/components/parameters/Page' }
      - { $ref: '../openapi.yaml#/components/parameters/Limit' }
      - { $ref: '../openapi.yaml#/components/parameters/Sort' }
    responses:
      '200': { $ref: '../openapi.yaml#/components/responses/ProductPage' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }
  post:
    tags: [Admin Catalog]
    operationId: createProduct
    x-prd-references: [US-A02, FR-ADMN-02, BR-05, BR-07]
    summary: Create a product and its initial variants
    description: |
      Initial variants start with zero inventory. Inventory is changed only through the inventory endpoint.
      An active product requires at least one active variant and exactly one thumbnail image; the request schema rejects violations with 400 VALIDATION_FAILED.
      At most one image may be the thumbnail. Setting isThumbnail=true atomically demotes the previous thumbnail.
    security: [{ bearerAuth: [] }]
    x-required-roles: [admin]
    x-required-permissions: [catalog:manage]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ProductCreateRequest' }
    responses:
      '201': { $ref: '../openapi.yaml#/components/responses/ProductDetail' }
      '400': { $ref: '../openapi.yaml#/components/responses/ValidationError' }
      '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
      '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
      '422': { $ref: '../openapi.yaml#/components/responses/BusinessRuleError' }
      '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }
      '500': { $ref: '../openapi.yaml#/components/responses/InternalServerError' }
