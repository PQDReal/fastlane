Category:
  type: object
  required: [id, name, slug, isActive]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, maxLength: 120 }
    slug: { type: string, maxLength: 160 }
    isActive: { type: boolean }
CategoryResponse: { type: object, required: [data], properties: { data: { $ref: '../../openapi.yaml#/components/schemas/Category' } } }
CategoryListResponse: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/Category' } } } }
CategoryCreateRequest:
  type: object
  additionalProperties: false
  required: [name, slug, isActive]
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    slug: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9-]+$' }
    isActive: { type: boolean }
CategoryPatchRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    slug: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9-]+$' }
    isActive: { type: boolean }
ProductKind:
  type: string
  enum: [car, motorbike, accessory]
  description: Stable business discriminator; category remains the mutable merchandising taxonomy.
PurchaseMode:
  type: string
  enum: [full, deposit]
CancellationCutoff:
  type: string
  enum: [before_initial_payment, before_balance_due, before_shipping]
CancellationPolicy:
  type: object
  additionalProperties: false
  required: [customerCancellationAllowed, customerCancellationCutoff, refundPercentage, overdueRefundPercentage, cancellationFeeAmount]
  properties:
    customerCancellationAllowed: { type: boolean }
    customerCancellationCutoff:
      allOf: [{ $ref: '../../openapi.yaml#/components/schemas/CancellationCutoff' }]
      description: before_balance_due is valid only for deposit products; backend enforces the cross-field rule.
    refundPercentage: { type: integer, minimum: 0, maximum: 100, description: Percentage of gross paid amount refundable for an allowed cancellation before overdue auto-cancellation. }
    overdueRefundPercentage: { type: integer, minimum: 0, maximum: 100, description: Percentage used when a deposit order is auto-cancelled after its grace period. }
    cancellationFeeAmount: { $ref: '../../openapi.yaml#/components/schemas/Money' }
PurchaseTerms:
  description: Product-level payment, deadline, grace-period, cancellation, and refund policy. Order items snapshot this object at checkout.
  oneOf:
    - type: object
      additionalProperties: false
      required: [paymentMode, depositAmount, initialPaymentWindowMinutes, balancePaymentWindowDays, gracePeriodHours, cancellationPolicy]
      properties:
        paymentMode: { allOf: [{ $ref: '../../openapi.yaml#/components/schemas/PurchaseMode' }], const: full }
        depositAmount: { type: 'null' }
        initialPaymentWindowMinutes: { type: integer, minimum: 5, maximum: 1440 }
        balancePaymentWindowDays: { type: 'null' }
        gracePeriodHours: { type: 'null' }
        cancellationPolicy: { $ref: '../../openapi.yaml#/components/schemas/CancellationPolicy' }
    - type: object
      additionalProperties: false
      required: [paymentMode, depositAmount, initialPaymentWindowMinutes, balancePaymentWindowDays, gracePeriodHours, cancellationPolicy]
      properties:
        paymentMode: { allOf: [{ $ref: '../../openapi.yaml#/components/schemas/PurchaseMode' }], const: deposit }
        depositAmount: { $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }
        initialPaymentWindowMinutes: { type: integer, minimum: 5, maximum: 1440 }
        balancePaymentWindowDays: { type: integer, minimum: 1, maximum: 365, description: Measured from successful initial deposit payment. }
        gracePeriodHours: { type: integer, minimum: 0, maximum: 720 }
        cancellationPolicy: { $ref: '../../openapi.yaml#/components/schemas/CancellationPolicy' }
BatteryOption:
  type: string
  enum: [included, purchase, subscription]
  description: included means no battery choice is required; purchase and subscription are explicit customer acquisition choices.
Price:
  type: object
  additionalProperties: false
  required: [currency, listPrice, effectivePrice]
  properties:
    currency: { type: string, enum: [VND] }
    listPrice: { $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }
    salePrice:
      description: When present, must be lower than listPrice.
      oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }, { type: 'null' }]
    effectivePrice:
      allOf: [{ $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }]
      readOnly: true
      description: salePrice when present; otherwise listPrice.
Variant:
  type: object
  additionalProperties: false
  required: [id, sku, attributes, batteryOption, price, availableQuantity, inventoryVersion, isActive, isPurchasable]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    sku: { type: string, minLength: 1, maxLength: 80 }
    attributes: { type: object, minProperties: 1, additionalProperties: { type: string }, examples: [{ color: Black, trim: Plus }] }
    batteryOption:
      description: Typed battery acquisition mode for electric vehicles; null for products where it does not apply.
      oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/BatteryOption' }, { type: 'null' }]
    price: { $ref: '../../openapi.yaml#/components/schemas/Price' }
    availableQuantity: { type: integer, minimum: 0, readOnly: true }
    inventoryVersion: { type: integer, minimum: 0, readOnly: true }
    isActive: { type: boolean }
    isPurchasable: { type: boolean, readOnly: true, description: True only when product and variant are active and inventory is positive. }
VariantResponse: { type: object, required: [data], properties: { data: { $ref: '../../openapi.yaml#/components/schemas/Variant' } } }
PriceRange:
  type: object
  additionalProperties: false
  description: Minimum and maximum base effective prices across active variants before dynamic option adjustments; active out-of-stock variants are included.
  required: [minimum, maximum, currency]
  properties:
    minimum: { $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }
    maximum: { $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }
    currency: { type: string, enum: [VND] }
ProductOptionValue:
  type: object
  additionalProperties: false
  required: [id, code, name, priceAdjustment, compatibleVariantSkus, isActive]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    code: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Z0-9_]+$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    priceAdjustment: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    compatibleVariantSkus:
      type: array
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 80 }
      description: Empty means compatible with every variant of the product.
    isActive: { type: boolean }
ProductOptionGroup:
  type: object
  additionalProperties: false
  required: [id, code, name, minimumSelections, maximumSelections, isActive, values]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    code: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Z0-9_]+$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    minimumSelections: { type: integer, minimum: 0, maximum: 20 }
    maximumSelections: { type: integer, minimum: 1, maximum: 20, description: Must be greater than or equal to minimumSelections. }
    isActive: { type: boolean }
    values: { type: array, minItems: 1, maxItems: 100, items: { $ref: '../../openapi.yaml#/components/schemas/ProductOptionValue' } }
ProductOptionValueInput:
  type: object
  additionalProperties: false
  required: [code, name, priceAdjustment, compatibleVariantSkus, isActive]
  properties:
    code: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Z0-9_]+$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    priceAdjustment: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    compatibleVariantSkus:
      type: array
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 80 }
      description: Empty means compatible with every variant in the same product request or persisted product.
    isActive: { type: boolean }
ProductOptionGroupInput:
  type: object
  additionalProperties: false
  required: [code, name, minimumSelections, maximumSelections, isActive, values]
  properties:
    code: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Z0-9_]+$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    minimumSelections: { type: integer, minimum: 0, maximum: 20 }
    maximumSelections: { type: integer, minimum: 1, maximum: 20, description: Must be greater than or equal to minimumSelections. }
    isActive: { type: boolean }
    values: { type: array, minItems: 1, maxItems: 100, items: { $ref: '../../openapi.yaml#/components/schemas/ProductOptionValueInput' } }
ProductSpecification:
  type: object
  additionalProperties: false
  required: [name, value, sortOrder]
  properties:
    name: { type: string, minLength: 1, maxLength: 120, example: Công suất tối đa }
    value: { type: string, minLength: 1, maxLength: 500, example: '150' }
    unit:
      oneOf: [{ type: string, minLength: 1, maxLength: 40, example: kW }, { type: 'null' }]
    group:
      oneOf: [{ type: string, minLength: 1, maxLength: 120, example: Động cơ }, { type: 'null' }]
    sortOrder: { type: integer, minimum: 0 }
AccessoryContentSectionType:
  type: string
  enum: [TECHNICAL_SPECS, FEATURES, USAGE_GUIDE, CARE_GUIDE, INSTALLATION_GUIDE, PACKAGE_CONTENTS, WARRANTY, SHIPPING_NOTE, SAFETY_NOTE, PURCHASE_NOTE, OTHER]
AccessoryContentAttribute:
  type: object
  additionalProperties: false
  required: [label, value]
  properties:
    label: { type: string, minLength: 1 }
    value: { type: string, minLength: 1 }
AccessoryContentSection:
  type: object
  additionalProperties: false
  required: [key, type, title, display_order, body, items, attributes]
  anyOf:
    - properties: { body: { type: string, minLength: 1 } }
    - properties: { items: { type: array, minItems: 1 } }
    - properties: { attributes: { type: array, minItems: 1 } }
  properties:
    key: { type: string, minLength: 1, pattern: '^[a-z0-9_]+$' }
    type: { $ref: '../../openapi.yaml#/components/schemas/AccessoryContentSectionType' }
    title: { type: string, minLength: 1 }
    display_order: { type: integer, minimum: 10, multipleOf: 10 }
    body:
      oneOf: [{ type: string, minLength: 1 }, { type: 'null' }]
    items:
      type: array
      items: { type: string, minLength: 1 }
    attributes:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/AccessoryContentAttribute' }
  description: Sections are ordered and keyed uniquely; display_order must be 10, 20, 30, ... in array order. At least one of body, items, or attributes must contain content.
AccessoryContentV1:
  type: object
  additionalProperties: false
  required: [schema, sections]
  properties:
    schema: { type: string, const: accessory_content_v1 }
    sections:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/AccessoryContentSection' }
ProductImage:
  type: object
  additionalProperties: false
  required: [id, url, altText, sortOrder, isThumbnail]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    url: { type: string, format: uri, maxLength: 2048 }
    altText: { type: string, minLength: 1, maxLength: 255 }
    sortOrder: { type: integer, minimum: 0 }
    isThumbnail: { type: boolean }
ProductImageCreateRequest:
  type: object
  additionalProperties: false
  required: [url, altText, sortOrder, isThumbnail]
  properties:
    url: { type: string, format: uri, maxLength: 2048 }
    altText: { type: string, minLength: 1, maxLength: 255 }
    sortOrder: { type: integer, minimum: 0 }
    isThumbnail: { type: boolean }
ProductImagePatchRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    url: { type: string, format: uri, maxLength: 2048 }
    altText: { type: string, minLength: 1, maxLength: 255 }
    sortOrder: { type: integer, minimum: 0 }
    isThumbnail: { type: boolean }
ProductImageResponse:
  type: object
  additionalProperties: false
  required: [data]
  properties:
    data: { $ref: '../../openapi.yaml#/components/schemas/ProductImage' }
CatalogCollectionKind:
  type: string
  enum: [CATEGORY, MODEL, CAMPAIGN]
CatalogVehicleFilterMode:
  type: string
  enum: [NONE, COLLECTION_MEMBERSHIP, VERIFIED_FITMENT]
  description: COLLECTION_MEMBERSHIP is source taxonomy membership and is not a verified installation-fitment claim.
CatalogVehicleModel:
  type: object
  additionalProperties: false
  required: [id, code, slug, name, vehicleKind]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    code: { type: string, minLength: 1, maxLength: 80 }
    slug: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    vehicleKind: { type: string, enum: [CAR, MOTORBIKE, OTHER] }
CatalogCollection:
  type: object
  additionalProperties: false
  required: [id, parentId, kind, sourceSystem, sourceKey, slug, name, vehicleFilterMode, displayOrder, vehicleModel]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    parentId: { oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
    kind: { $ref: '../../openapi.yaml#/components/schemas/CatalogCollectionKind' }
    sourceSystem: { type: string, minLength: 1, maxLength: 80 }
    sourceKey: { type: string, minLength: 1, maxLength: 160 }
    slug: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    vehicleFilterMode: { $ref: '../../openapi.yaml#/components/schemas/CatalogVehicleFilterMode' }
    displayOrder: { type: integer, minimum: 0 }
    vehicleModel:
      oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/CatalogVehicleModel' }, { type: 'null' }]
AdminCatalogCollection:
  type: object
  additionalProperties: false
  required: [id, parentId, kind, slug, name, displayOrder]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    parentId: { oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
    kind: { $ref: '../../openapi.yaml#/components/schemas/CatalogCollectionKind' }
    slug: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    name: { type: string, minLength: 1, maxLength: 160 }
    displayOrder: { type: integer, minimum: 0 }
CatalogCollectionMembership:
  type: object
  additionalProperties: false
  required: [id, sourceSystem, isPrimary, firstSeenAt, lastSeenAt, collection]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    sourceSystem: { type: string, minLength: 1, maxLength: 80 }
    isPrimary: { type: boolean }
    firstSeenAt: { type: string, format: date-time }
    lastSeenAt: { type: string, format: date-time }
    collection: { $ref: '../../openapi.yaml#/components/schemas/CatalogCollection' }
ProductSummary:
  type: object
  additionalProperties: false
  required: [id, name, slug, productKind, purchaseTerms, category, thumbnailUrl, priceRange, isActive]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, minLength: 1, maxLength: 200 }
    slug: { type: string, minLength: 1, maxLength: 220 }
    productKind: { $ref: '../../openapi.yaml#/components/schemas/ProductKind' }
    purchaseTerms: { $ref: '../../openapi.yaml#/components/schemas/PurchaseTerms' }
    category: { $ref: '../../openapi.yaml#/components/schemas/Category' }
    thumbnailUrl: { oneOf: [{ type: string, format: uri }, { type: 'null' }], description: Non-null for public active products; may be null in admin draft results. }
    priceRange: { $ref: '../../openapi.yaml#/components/schemas/PriceRange' }
    isActive: { type: boolean }
    collectionMemberships:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/CatalogCollectionMembership' }
      description: Optional normalized taxonomy projection during the v1 compatibility rollout.
ProductDetail:
  type: object
  additionalProperties: false
  required: [id, name, slug, productKind, purchaseTerms, category, thumbnailUrl, priceRange, isActive, description, images, specifications, variants, optionGroups, createdAt, updatedAt]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, minLength: 1, maxLength: 200 }
    slug: { type: string, minLength: 1, maxLength: 220 }
    productKind: { $ref: '../../openapi.yaml#/components/schemas/ProductKind' }
    purchaseTerms: { $ref: '../../openapi.yaml#/components/schemas/PurchaseTerms' }
    category: { $ref: '../../openapi.yaml#/components/schemas/Category' }
    thumbnailUrl: { oneOf: [{ type: string, format: uri }, { type: 'null' }], description: Non-null for public active products; may be null in admin draft results. }
    priceRange: { $ref: '../../openapi.yaml#/components/schemas/PriceRange' }
    isActive: { type: boolean }
    description: { type: string, minLength: 1, maxLength: 10000 }
    images: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/ProductImage' } }
    specifications:
      oneOf:
        - type: array
          items: { $ref: '../../openapi.yaml#/components/schemas/ProductSpecification' }
        - { $ref: '../../openapi.yaml#/components/schemas/AccessoryContentV1' }
      description: Accessories use AccessoryContentV1; vehicle products retain the legacy specification array.
    variants: { type: array, minItems: 1, items: { $ref: '../../openapi.yaml#/components/schemas/Variant' }, description: Public detail contains active variants only; admin detail may also contain inactive variants. }
    optionGroups:
      type: array
      maxItems: 20
      items: { $ref: '../../openapi.yaml#/components/schemas/ProductOptionGroup' }
      description: Non-inventory configuration modifiers. Choices that alter SKU or inventory remain variant attributes. Public detail exposes active groups and active values only; admin detail may include inactive entries.
    collectionMemberships:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/CatalogCollectionMembership' }
      description: Optional normalized taxonomy projection; MODEL membership does not imply verified technical fitment.
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
ProductDetailResponse: { type: object, required: [data], properties: { data: { $ref: '../../openapi.yaml#/components/schemas/ProductDetail' } } }
ProductPageResponse:
  type: object
  required: [data, meta]
  properties:
    data: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/ProductSummary' } }
    meta: { $ref: '../../openapi.yaml#/components/schemas/PageMeta' }
VariantCreateRequest:
  type: object
  additionalProperties: false
  description: salePrice, when present, must be lower than listPrice; otherwise the request violates BR-07.
  required: [sku, attributes, batteryOption, listPrice, isActive]
  properties:
    sku: { type: string, minLength: 1, maxLength: 80 }
    attributes: { type: object, minProperties: 1, additionalProperties: { type: string } }
    batteryOption:
      oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/BatteryOption' }, { type: 'null' }]
    listPrice: { $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }
    salePrice: { oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }, { type: 'null' }], description: Must be lower than listPrice when present. }
    isActive: { type: boolean }
VariantPatchRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  description: The resulting salePrice, when present, must be lower than the resulting listPrice.
  properties:
    sku: { type: string, minLength: 1, maxLength: 80 }
    attributes: { type: object, minProperties: 1, additionalProperties: { type: string } }
    batteryOption:
      oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/BatteryOption' }, { type: 'null' }]
    listPrice: { $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }
    salePrice: { oneOf: [{ $ref: '../../openapi.yaml#/components/schemas/PositiveMoney' }, { type: 'null' }], description: Must be lower than the resulting listPrice when present. }
    isActive: { type: boolean }
InventoryUpdateRequest:
  type: object
  additionalProperties: false
  required: [availableQuantity, expectedVersion]
  examples:
    - availableQuantity: 10
      expectedVersion: 3
  properties:
    availableQuantity: { type: integer, minimum: 0 }
    expectedVersion: { type: integer, minimum: 0 }
ProductCreateRequest:
  type: object
  additionalProperties: false
  description: Active products require at least one active variant and exactly one thumbnail image; every product permits at most one thumbnail.
  required: [categoryId, name, slug, productKind, purchaseTerms, description, specifications, optionGroups, isActive, variants]
  if:
    properties: { isActive: { const: true } }
    required: [isActive]
  then:
    required: [images]
    properties:
      images:
        minItems: 1
        contains:
          type: object
          required: [isThumbnail]
          properties: { isThumbnail: { const: true } }
        minContains: 1
        maxContains: 1
      variants:
        contains:
          type: object
          required: [isActive]
          properties: { isActive: { const: true } }
        minContains: 1
  examples:
    - categoryId: 123e4567-e89b-12d3-a456-426614174001
      name: VinFast VF 8
      slug: vinfast-vf-8
      productKind: car
      purchaseTerms:
        paymentMode: deposit
        depositAmount: '30000000'
        initialPaymentWindowMinutes: 30
        balancePaymentWindowDays: 7
        gracePeriodHours: 48
        cancellationPolicy:
          customerCancellationAllowed: true
          customerCancellationCutoff: before_balance_due
          refundPercentage: 100
          overdueRefundPercentage: 0
          cancellationFeeAmount: '0'
      description: Mẫu SUV điện cỡ D.
      specifications:
        - { name: Công suất tối đa, value: '300', unit: kW, group: Động cơ, sortOrder: 0 }
      images:
        - { url: 'https://cdn.example.org/vf8/front.jpg', altText: VinFast VF 8 nhìn từ phía trước, sortOrder: 0, isThumbnail: true }
      isActive: false
      optionGroups: []
      variants:
        - sku: VF8-ECO-BLACK
          attributes: { trim: Eco, color: Black }
          batteryOption: included
          listPrice: '1200000000'
          salePrice: null
          isActive: true
  properties:
    categoryId: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, minLength: 1, maxLength: 200 }
    slug: { type: string, minLength: 1, maxLength: 220, pattern: '^[a-z0-9-]+$' }
    productKind: { $ref: '../../openapi.yaml#/components/schemas/ProductKind' }
    purchaseTerms: { $ref: '../../openapi.yaml#/components/schemas/PurchaseTerms' }
    description: { type: string, minLength: 1, maxLength: 10000 }
    specifications:
      oneOf:
        - type: array
          items: { $ref: '../../openapi.yaml#/components/schemas/ProductSpecification' }
        - { $ref: '../../openapi.yaml#/components/schemas/AccessoryContentV1' }
      description: Required to be AccessoryContentV1 when productKind is accessory; vehicle products use the specification array.
    optionGroups:
      type: array
      maxItems: 20
      items: { $ref: '../../openapi.yaml#/components/schemas/ProductOptionGroupInput' }
      description: Full initial set of non-inventory option groups. Option/group codes must be unique within the product.
    images:
      type: array
      maxItems: 20
      items: { $ref: '../../openapi.yaml#/components/schemas/ProductImageCreateRequest' }
      contains:
        type: object
        required: [isThumbnail]
        properties: { isThumbnail: { const: true } }
      minContains: 0
      maxContains: 1
      description: Zero or one item may be the thumbnail; an active product requires exactly one.
    isActive: { type: boolean, description: 'When true, this request must contain at least one active variant and exactly one thumbnail; otherwise schema validation returns 400.' }
    variants: { type: array, minItems: 1, items: { $ref: '../../openapi.yaml#/components/schemas/VariantCreateRequest' } }
ProductPatchRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  description: Setting isActive=true requires at least one persisted active variant and exactly one persisted thumbnail image.
  properties:
    categoryId: { $ref: '../../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, minLength: 1, maxLength: 200 }
    slug: { type: string, minLength: 1, maxLength: 220, pattern: '^[a-z0-9-]+$' }
    productKind: { $ref: '../../openapi.yaml#/components/schemas/ProductKind' }
    purchaseTerms: { $ref: '../../openapi.yaml#/components/schemas/PurchaseTerms' }
    description: { type: string, minLength: 1, maxLength: 10000 }
    specifications:
      oneOf:
        - type: array
          items: { $ref: '../../openapi.yaml#/components/schemas/ProductSpecification' }
        - { $ref: '../../openapi.yaml#/components/schemas/AccessoryContentV1' }
