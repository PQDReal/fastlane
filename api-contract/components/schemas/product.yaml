    optionGroups: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/AdminAccessoryDraftOptionGroup' } }
    variants: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/AdminAccessoryDraftVariant' } }
