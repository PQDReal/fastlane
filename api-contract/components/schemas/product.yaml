    minimumSelections: { type: integer, enum: [0, 1] }
    maximumSelections: { type: integer, const: 1 }
    values:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/AdminAccessoryDraftOptionValue' }
AdminAccessoryDraftVariant:
  type: object
  additionalProperties: false
