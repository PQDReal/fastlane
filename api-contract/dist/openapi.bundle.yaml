    ProductCreateRequest:
      type: object
      additionalProperties: false
      description: Active products require at least one active variant and exactly one thumbnail image; every product permits at most one thumbnail.
      required:
        - categoryId
        - name
        - slug
        - productKind
        - purchaseTerms
        - description
        - specifications
        - optionGroups
        - isActive
        - variants
      if:
        properties:
          isActive:
            const: true
        required:
          - isActive
      then:
        required:
          - images
        properties:
          images:
            minItems: 1
            contains:
              type: object
              required:
                - isThumbnail
              properties:
                isThumbnail:
                  const: true
            minContains: 1
            maxContains: 1
          variants:
            contains:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  const: true
            minContains: 1
      examples:
        - categoryId: 123e4567-e89b-12d3-a456-426614174001
          name: VinFast VF 8
          slug: vinfast-vf-8
          productKind: car
          purchaseTerms:
            paymentMode: deposit
            depositAmount: '30000000'
            initialPaymentWindowMinutes: 30
            balancePaymentWindowDays: 7
            gracePeriodHours: 48
            cancellationPolicy:
              customerCancellationAllowed: true
              customerCancellationCutoff: before_balance_due
