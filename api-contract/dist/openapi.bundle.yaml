      x-error-codes:
        - INVALID_ORDER_TRANSITION
        - IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ORDER_TRANSITION
              message: Order can no longer be cancelled from its current state.
              requestId: req_01J00000000000000000000000
    MockPayment:
      description: Mock payment simulation result and current order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockPaymentResponse'
    MockPaymentConflict:
      description: Mock payment conflicts with the order state or with an earlier idempotency fingerprint.
      x-error-codes:
        - INVALID_ORDER_TRANSITION
        - IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTransition:
              value:
                error:
                  code: INVALID_ORDER_TRANSITION
                  message: Order is not eligible for its next payment.
                  requestId: req_01J00000000000000000000000
            keyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with another order or result.
                  requestId: req_01J00000000000000000000000
    MockRefund:
      description: Mock refund simulation result and current order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockRefundResponse'
    MockRefundConflict:
      description: Mock refund conflicts with refund state or with an earlier idempotency fingerprint.
      x-error-codes:
        - INVALID_ORDER_TRANSITION
        - IDEMPOTENCY_KEY_REUSED
