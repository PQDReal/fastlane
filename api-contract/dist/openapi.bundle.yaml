              message: Recalculate the on-road estimate before continuing.
              requestId: req_01J00000000000000000000000
    CustomerProfile:
      description: Current customer profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerProfileResponse'
    Unauthorized:
      description: Missing, invalid, or expired access token.
      x-error-codes:
        - AUTHENTICATION_REQUIRED
        - INVALID_ACCESS_TOKEN
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Authentication is required.
              requestId: req_01J00000000000000000000000
    Forbidden:
      description: Principal lacks the required role or at least one required permission.
      x-error-codes:
        - INSUFFICIENT_PERMISSION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_PERMISSION
              message: Permission is insufficient.
              requestId: req_01J00000000000000000000000
    Cart:
      description: Repriced cart
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartResponse'
    OutOfStock:
      description: Requested quantity is unavailable.
      x-error-codes:
        - OUT_OF_STOCK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: OUT_OF_STOCK
              message: Requested quantity is unavailable.
              requestId: req_01J00000000000000000000000
    BusinessRuleError:
      description: Request is well-formed but violates a business invariant.
      x-error-codes:
        - PRODUCT_NOT_PURCHASABLE
        - PRODUCT_CONFIGURATION_INVALID
        - ORDER_CANCELLATION_NOT_ALLOWED
        - PAYMENT_DEADLINE_EXPIRED
        - REFUND_NOT_ALLOWED
        - CART_EMPTY
        - BUSINESS_RULE_VIOLATION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BUSINESS_RULE_VIOLATION
              message: Business rule was violated.
              requestId: req_01J00000000000000000000000
    InvalidPromotion:
      description: Promotion cannot be applied to the current cart.
      x-error-codes:
        - PROMOTION_INVALID
        - PROMOTION_INACTIVE
        - PROMOTION_NOT_STARTED
        - PROMOTION_EXPIRED
        - PROMOTION_MINIMUM_NOT_MET
        - PROMOTION_USAGE_LIMIT_REACHED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PROMOTION_INVALID
              message: Promotion cannot be applied.
              requestId: req_01J00000000000000000000000
    Order:
      description: Order detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    CheckoutConflict:
      description: Cart, configured price, stock, or idempotency fingerprint changed and checkout cannot complete.
      x-error-codes:
        - CART_CHANGED
        - PRICE_CHANGED
        - OUT_OF_STOCK
        - IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cartChanged:
              value:
                error:
                  code: CART_CHANGED
                  message: Cart changed; review it before retrying.
                  requestId: req_01J00000000000000000000000
            priceChanged:
              value:
                error:
                  code: PRICE_CHANGED
                  message: Price changed; review it before retrying.
                  requestId: req_01J00000000000000000000000
            keyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with a different request.
                  requestId: req_01J00000000000000000000000
    OrderPage:
      description: Order page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderPageResponse'
    CancellationConflict:
