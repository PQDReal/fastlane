        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Auth0 RS256 JWT access token for this API. Deployment configuration supplies issuer, audience, JWKS URI, and namespaced roles claim.
        The backend validates signature, iss, aud, exp, role, permissions, and resource ownership. ID tokens are not accepted as API credentials.
  parameters:
    Query:
      name: q
      in: query
      description: Trimmed free-text query. Empty or whitespace-only values are invalid when supplied.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: ^[a-z0-9-]+$
    MinimumPrice:
      name: minPrice
      in: query
      description: Inclusive minimum effective active-variant price. Must not exceed maxPrice when both are supplied.
      schema:
        $ref: '#/components/schemas/Money'
    MaximumPrice:
      name: maxPrice
      in: query
      description: Inclusive maximum effective active-variant price. Must be greater than or equal to minPrice when both are supplied.
      schema:
        $ref: '#/components/schemas/Money'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: relevance requires q. If omitted, q uses relevance and requests without q use newest.
      schema:
        type: string
        enum:
          - relevance
          - newest
          - price_asc
          - price_desc
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 220
        pattern: ^[a-z0-9-]+$
    CartItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key, retained for at least 24 hours for this customer and endpoint.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: ^[A-Za-z0-9._:-]+$
    OrderStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/OrderStatus'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CategoryIdFilter:
      name: categoryId
      in: query
      schema:
        $ref: '#/components/schemas/Uuid'
    IsActive:
      name: isActive
      in: query
      schema:
        type: boolean
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProductImageId:
      name: imageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CreatedFrom:
      name: createdFrom
      in: query
      description: Inclusive RFC 3339 lower bound. Must not be later than createdTo when both are supplied.
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      description: Inclusive RFC 3339 upper bound. Must not be earlier than createdFrom when both are supplied.
      schema:
        type: string
        format: date-time
    OrderSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - created_asc
          - status_asc
        default: created_desc
  responses:
    TooManyRequests:
      description: Rate limit exceeded.
      x-error-codes:
        - RATE_LIMIT_EXCEEDED
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds before retrying.
        X-RateLimit-Limit:
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Reset:
          schema:
            type: integer
            minimum: 0
          description: Unix epoch seconds when the window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Rate limit exceeded.
              requestId: req_01J00000000000000000000000
    InternalServerError:
      description: Unexpected server error. Internal details are not exposed.
      x-error-codes:
        - INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected server error.
              requestId: req_01J00000000000000000000000
    CategoryList:
      description: Category list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CategoryListResponse'
    ProductPage:
      description: Product page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductPageResponse'
    ValidationError:
      description: Request syntax, parameters, or schema are invalid.
      x-error-codes:
        - VALIDATION_FAILED
        - DATE_RANGE_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_FAILED
              message: Request validation failed.
              requestId: req_01J00000000000000000000000
              fields:
                - path: shippingAddress.phoneNumber
                  code: INVALID_PHONE
    ProductDetail:
      description: Product detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductDetailResponse'
    NotFound:
      description: Resource does not exist or is not visible to this principal.
      x-error-codes:
        - RESOURCE_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Resource was not found.
              requestId: req_01J00000000000000000000000
    CustomerProfile:
      description: Current customer profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerProfileResponse'
    Unauthorized:
      description: Missing, invalid, or expired access token.
      x-error-codes:
        - AUTHENTICATION_REQUIRED
        - INVALID_ACCESS_TOKEN
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Authentication is required.
              requestId: req_01J00000000000000000000000
    Forbidden:
      description: Principal lacks the required role or at least one required permission.
      x-error-codes:
        - INSUFFICIENT_PERMISSION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_PERMISSION
              message: Permission is insufficient.
              requestId: req_01J00000000000000000000000
    Cart:
      description: Repriced cart
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartResponse'
    OutOfStock:
      description: Requested quantity is unavailable.
      x-error-codes:
        - OUT_OF_STOCK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: OUT_OF_STOCK
              message: Requested quantity is unavailable.
              requestId: req_01J00000000000000000000000
    InvalidPromotion:
      description: Promotion cannot be applied to the current cart.
      x-error-codes:
        - PROMOTION_INVALID
        - PROMOTION_INACTIVE
        - PROMOTION_NOT_STARTED
        - PROMOTION_EXPIRED
        - PROMOTION_MINIMUM_NOT_MET
        - PROMOTION_USAGE_LIMIT_REACHED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PROMOTION_INVALID
              message: Promotion cannot be applied.
              requestId: req_01J00000000000000000000000
    Order:
      description: Order detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    CheckoutConflict:
      description: Cart, price, stock, or idempotency fingerprint changed and checkout cannot complete.
      x-error-codes:
        - CART_CHANGED
        - PRICE_CHANGED
        - OUT_OF_STOCK
        - IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cartChanged:
              value:
                error:
                  code: CART_CHANGED
                  message: Cart changed; review it before retrying.
                  requestId: req_01J00000000000000000000000
            priceChanged:
              value:
                error:
                  code: PRICE_CHANGED
                  message: Price changed; review it before retrying.
                  requestId: req_01J00000000000000000000000
            keyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with a different request.
                  requestId: req_01J00000000000000000000000
    BusinessRuleError:
      description: Request is well-formed but violates a business invariant.
      x-error-codes:
        - PRODUCT_NOT_PURCHASABLE
        - CART_EMPTY
        - BUSINESS_RULE_VIOLATION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BUSINESS_RULE_VIOLATION
              message: Business rule was violated.
              requestId: req_01J00000000000000000000000
    OrderPage:
      description: Order page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderPageResponse'
    MockPayment:
      description: Mock payment simulation result and current order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockPaymentResponse'
    MockPaymentConflict:
      description: Mock payment conflicts with the order state or with an earlier idempotency fingerprint.
      x-error-codes:
        - INVALID_ORDER_TRANSITION
        - IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTransition:
              value:
                error:
                  code: INVALID_ORDER_TRANSITION
                  message: Only a Created order may be paid.
                  requestId: req_01J00000000000000000000000
            keyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with another order or result.
                  requestId: req_01J00000000000000000000000
    DashboardSummary:
      description: Admin dashboard summary
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardSummaryResponse'
    Category:
      description: Category
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CategoryResponse'
    Conflict:
      description: Request conflicts with current state or a unique constraint.
      x-error-codes:
        - CONFLICT
        - CATEGORY_IN_USE
        - DUPLICATE_CATEGORY_SLUG
        - DUPLICATE_PRODUCT_SLUG
        - DUPLICATE_SKU
        - DUPLICATE_PROMOTION_CODE
        - INVENTORY_VERSION_CONFLICT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Request conflicts with current state.
              requestId: req_01J00000000000000000000000
    Variant:
      description: Variant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VariantResponse'
    ProductImage:
      description: Product image
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductImageResponse'
    PromotionPage:
      description: Promotion page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromotionPageResponse'
    Promotion:
      description: Promotion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromotionResponse'
    AdminOrderPage:
      description: Administrative order page with customer and recipient match context
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminOrderPageResponse'
    InvalidOrderTransition:
      description: Requested transition conflicts with current order state or expectedCurrentStatus.
      x-error-codes:
        - INVALID_ORDER_TRANSITION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ORDER_TRANSITION
              message: Order transition is not allowed.
              requestId: req_01J00000000000000000000000
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - ok
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - DATE_RANGE_INVALID
        - AUTHENTICATION_REQUIRED
        - INVALID_ACCESS_TOKEN
        - INSUFFICIENT_PERMISSION
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - CATEGORY_IN_USE
        - DUPLICATE_CATEGORY_SLUG
        - DUPLICATE_PRODUCT_SLUG
        - DUPLICATE_SKU
        - DUPLICATE_PROMOTION_CODE
        - PRODUCT_NOT_PURCHASABLE
        - CART_EMPTY
        - CART_CHANGED
        - PRICE_CHANGED
        - OUT_OF_STOCK
        - PROMOTION_INVALID
        - PROMOTION_INACTIVE
        - PROMOTION_NOT_STARTED
        - PROMOTION_EXPIRED
        - PROMOTION_MINIMUM_NOT_MET
        - PROMOTION_USAGE_LIMIT_REACHED
        - IDEMPOTENCY_KEY_REUSED
        - INVENTORY_VERSION_CONFLICT
        - INVALID_ORDER_TRANSITION
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMIT_EXCEEDED
        - INTERNAL_ERROR
    ValidationFieldCode:
      type: string
      enum:
        - REQUIRED
        - UNKNOWN_FIELD
        - INVALID_FORMAT
        - INVALID_VALUE
        - INVALID_PHONE
        - OUT_OF_RANGE
        - TOO_SHORT
        - TOO_LONG
    ErrorField:
      type: object
      additionalProperties: false
      required:
        - path
        - code
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 200
          example: shippingAddress.phoneNumber
        code:
          $ref: '#/components/schemas/ValidationFieldCode'
        meta:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Safe presentation-neutral diagnostic; client localizes user-facing text from code.
            requestId:
              type: string
              minLength: 1
              maxLength: 100
            fields:
              type: array
              items:
                $ref: '#/components/schemas/ErrorField'
            meta:
              type: object
              additionalProperties: true
    Uuid:
      type: string
      format: uuid
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 160
        isActive:
          type: boolean
    CategoryListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Money:
      type: string
      pattern: ^(0|[1-9]\d*)$
      examples:
        - '199000'
      description: Non-negative whole-VND amount encoded as a base-10 string to avoid floating-point loss.
    PositiveMoney:
      type: string
      pattern: ^[1-9]\d*$
      examples:
        - '199000'
      description: Strictly positive whole-VND amount.
    PriceRange:
      type: object
      additionalProperties: false
      description: Minimum and maximum effective prices across active variants; active out-of-stock variants are included.
      required:
        - minimum
        - maximum
        - currency
      properties:
        minimum:
          $ref: '#/components/schemas/PositiveMoney'
        maximum:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          enum:
            - VND
    ProductSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - category
        - thumbnailUrl
        - priceRange
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 220
        category:
          $ref: '#/components/schemas/Category'
        thumbnailUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
          description: Non-null for public active products; may be null in admin draft results.
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        isActive:
          type: boolean
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProductPageResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ProductImage:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - altText
        - sortOrder
        - isThumbnail
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
          maxLength: 2048
        altText:
          type: string
          minLength: 1
          maxLength: 255
        sortOrder:
          type: integer
          minimum: 0
        isThumbnail:
          type: boolean
    ProductSpecification:
      type: object
      additionalProperties: false
      required:
        - name
        - value
        - sortOrder
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Công suất tối đa
        value:
          type: string
          minLength: 1
          maxLength: 500
          example: '150'
        unit:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 40
              example: kW
            - type: 'null'
        group:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
              example: Động cơ
            - type: 'null'
        sortOrder:
          type: integer
          minimum: 0
    Price:
      type: object
      additionalProperties: false
      required:
        - currency
        - listPrice
        - effectivePrice
      properties:
        currency:
          type: string
          enum:
            - VND
        listPrice:
          $ref: '#/components/schemas/PositiveMoney'
        salePrice:
          description: When present, must be lower than listPrice.
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        effectivePrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          readOnly: true
          description: salePrice when present; otherwise listPrice.
    Variant:
      type: object
      additionalProperties: false
      required:
        - id
        - sku
        - attributes
        - price
        - availableQuantity
        - inventoryVersion
        - isActive
        - isPurchasable
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sku:
          type: string
          minLength: 1
          maxLength: 80
        attributes:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          examples:
            - color: Black
              trim: Plus
        price:
          $ref: '#/components/schemas/Price'
        availableQuantity:
          type: integer
          minimum: 0
          readOnly: true
        inventoryVersion:
          type: integer
          minimum: 0
          readOnly: true
        isActive:
          type: boolean
        isPurchasable:
          type: boolean
          readOnly: true
          description: True only when product and variant are active and inventory is positive.
    ProductDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - category
        - thumbnailUrl
        - priceRange
        - isActive
        - description
        - images
        - specifications
        - variants
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 220
        category:
          $ref: '#/components/schemas/Category'
        thumbnailUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
          description: Non-null for public active products; may be null in admin draft results.
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        isActive:
          type: boolean
        description:
          type: string
          minLength: 1
          maxLength: 10000
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        specifications:
          type: array
          items:
            $ref: '#/components/schemas/ProductSpecification'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Variant'
          description: Public detail contains active variants only; admin detail may also contain inactive variants.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ProductDetail'
    ShippingAddress:
      type: object
      additionalProperties: false
      required:
        - recipientName
        - phoneNumber
        - line1
        - communeLevel
        - province
        - countryCode
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed by the server.
        phoneNumber:
          type: string
          pattern: ^\+?[0-9]{9,15}$
          description: Normalized by the server before storage.
        line1:
          type: string
          minLength: 1
          maxLength: 255
        line2:
          type: string
          minLength: 1
          maxLength: 255
        communeLevel:
          type: object
          additionalProperties: false
          required:
            - name
            - type
          properties:
            code:
              type: string
              maxLength: 20
            name:
              type: string
              minLength: 1
              maxLength: 120
            type:
              type: string
              enum:
                - COMMUNE
                - WARD
                - SPECIAL_ZONE
        province:
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            code:
              type: string
              maxLength: 20
            name:
              type: string
              minLength: 1
              maxLength: 120
        countryCode:
          type: string
          enum:
            - VN
    CustomerProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - fullName
        - phoneNumber
        - defaultShippingAddress
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          enum:
            - customer
          readOnly: true
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phoneNumber:
          oneOf:
            - type: string
              pattern: ^\+?[0-9]{9,15}$
            - type: 'null'
        defaultShippingAddress:
          oneOf:
            - $ref: '#/components/schemas/ShippingAddress'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CustomerProfileResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CustomerProfile'
    CustomerProfilePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      examples:
        - fullName: Nguyễn Văn A
          phoneNumber: '+84901234567'
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phoneNumber:
          oneOf:
            - type: string
              pattern: ^\+?[0-9]{9,15}$
            - type: 'null'
        defaultShippingAddress:
          oneOf:
            - $ref: '#/components/schemas/ShippingAddress'
            - type: 'null'
    CartItem:
      type: object
      additionalProperties: false
      required:
        - id
        - variantId
        - productName
        - sku
        - variantAttributes
        - quantity
        - unitListPrice
        - unitSalePrice
        - unitPrice
        - lineTotal
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        variantId:
          $ref: '#/components/schemas/Uuid'
        productName:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          minLength: 1
          maxLength: 80
        variantAttributes:
          type: object
          additionalProperties:
            type: string
        quantity:
          type: integer
          minimum: 1
        unitListPrice:
          $ref: '#/components/schemas/PositiveMoney'
        unitSalePrice:
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: Effective unit price charged before the cart-level promotion.
        lineTotal:
          $ref: '#/components/schemas/Money'
    PercentageDiscount:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - percentage
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          multipleOf: 0.01
          example: 10
    FixedAmountDiscount:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - fixed_amount
        value:
          $ref: '#/components/schemas/PositiveMoney'
    PromotionDiscount:
      oneOf:
        - $ref: '#/components/schemas/PercentageDiscount'
        - $ref: '#/components/schemas/FixedAmountDiscount'
      discriminator:
        propertyName: type
        mapping:
          percentage: '#/components/schemas/PercentageDiscount'
          fixed_amount: '#/components/schemas/FixedAmountDiscount'
    AppliedPromotion:
      type: object
      additionalProperties: false
      required:
        - promotionId
        - code
        - discount
        - discountAmount
      properties:
        promotionId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          minLength: 3
          maxLength: 64
        discount:
          $ref: '#/components/schemas/PromotionDiscount'
        discountAmount:
          $ref: '#/components/schemas/Money'
    CartPricing:
      type: object
      additionalProperties: false
      required:
        - currency
        - subtotal
        - discountTotal
        - grandTotal
      properties:
        currency:
          type: string
          enum:
            - VND
        subtotal:
          $ref: '#/components/schemas/Money'
        discountTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Never exceeds subtotal.
        grandTotal:
          $ref: '#/components/schemas/Money'
    Cart:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - pricedAt
        - items
        - promotion
        - pricing
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 0
          description: Increments whenever cart items, promotion, or calculated pricing changes.
        pricedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        promotion:
          oneOf:
            - $ref: '#/components/schemas/AppliedPromotion'
            - type: 'null'
        pricing:
          $ref: '#/components/schemas/CartPricing'
    CartResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Cart'
    AddCartItemRequest:
      type: object
      additionalProperties: false
      required:
        - variantId
        - quantity
      examples:
        - variantId: 123e4567-e89b-12d3-a456-426614174002
          quantity: 1
      properties:
        variantId:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    ApplyPromotionRequest:
      type: object
      additionalProperties: false
      required:
        - code
      examples:
        - code: WELCOME10
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          example: WELCOME10
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
        - expectedCartVersion
        - acceptedGrandTotal
        - shippingAddress
      examples:
        - expectedCartVersion: 4
          acceptedGrandTotal: '1200000000'
          shippingAddress:
            recipientName: Nguyễn Văn A
            phoneNumber: '+84901234567'
            line1: 1 Đường Nguyễn Huệ
            communeLevel:
              code: '26734'
              name: Phường Bến Nghé
              type: WARD
            province:
              code: '79'
              name: Hồ Chí Minh
            countryCode: VN
          note: Liên hệ trước khi giao.
      properties:
        expectedCartVersion:
          type: integer
          minimum: 0
        acceptedGrandTotal:
          $ref: '#/components/schemas/Money'
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        note:
          type: string
          maxLength: 500
    CustomerReference:
      type: object
      additionalProperties: false
      required:
        - id
        - email
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
    OrderStatus:
      type: string
      enum:
        - Created
        - Paid
        - Shipped
        - Completed
        - Cancelled
    OrderItem:
      type: object
      additionalProperties: false
      required:
        - id
        - variantId
        - productName
        - sku
        - variantAttributes
        - quantity
        - unitListPrice
        - unitSalePrice
        - unitPrice
        - lineTotal
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        variantId:
          $ref: '#/components/schemas/Uuid'
        productName:
