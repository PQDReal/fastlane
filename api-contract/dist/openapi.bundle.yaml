openapi: 3.1.0
info:
  title: Fastlane E-Commerce API
  version: 0.2.0-draft
  summary: Contract-first REST API for the Fastlane B2C MVP
  description: |
    Week-1 API contract aligned with PRD Fastlane E-Commerce v1.0.0.
    This artifact defines the integration boundary before backend, storefront, admin, database, and infrastructure work are merged.
    All money values are non-negative whole-VND strings. Pricing, promotion eligibility, and inventory are calculated on the server.
    Catalog content is available only in vi-VN. UI and error messages are localized by the client from stable error codes.
    Authentication and registration use Auth0 Universal Login; this API does not duplicate Auth0 login, registration, or logout endpoints.
  license:
    name: Internal training use only
    identifier: LicenseRef-Internal-Training
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service health and readiness.
  - name: Catalog
    description: Public VinFast product discovery, category filtering, and detail.
  - name: Profile
    description: Current authenticated customer profile and default shipping address.
  - name: Cart
    description: Current authenticated customer cart and one optional promotion code.
  - name: Checkout
    description: Transactional order creation and local-only mock payment.
  - name: Orders
    description: Current customer order history and status tracking.
  - name: Admin Dashboard
    description: Optional MVP operational summary for the admin panel.
  - name: Admin Catalog
    description: Category, product, variant, image, price, and inventory administration.
  - name: Admin Promotions
    description: Promotion campaign administration.
  - name: Admin Orders
    description: Order search, fulfilment detail, and forward-only state transitions.
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      security: []
      summary: Readiness check
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories:
    get:
      tags:
        - Catalog
      operationId: listCategories
      x-prd-references:
        - US-C02
        - US-C05
        - FR-PROD-02
      security: []
      summary: List active categories
      responses:
        '200':
          $ref: '#/components/responses/CategoryList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products:
    get:
      tags:
        - Catalog
      operationId: listProducts
      x-prd-references:
        - US-C02
        - US-C04
        - US-C05
        - FR-PROD-02
        - FR-PROD-03
      security: []
      summary: Search and browse active products
      description: |
        Full-text search matches Vietnamese product name, SKU, and description case-insensitively.
        Only active products are returned. Public detail exposes active variants only; an active out-of-stock variant remains visible with isPurchasable=false.
        Category and inclusive price filters may be combined. minPrice must not exceed maxPrice. Price filters, sorting, and priceRange use effective prices of active variants.
        When q is present and sort is omitted, results use relevance then product ID. Otherwise results use newest then product ID.
        sort=relevance requires q; without q it returns VALIDATION_FAILED.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/MinimumPrice'
        - $ref: '#/components/parameters/MaximumPrice'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{slug}:
    get:
      tags:
        - Catalog
      operationId: getProductBySlug
      x-prd-references:
        - US-C03
        - FR-PROD-01
      security: []
      summary: Get an active product by slug
      description: Returns active variants only. Out-of-stock active variants remain visible with isPurchasable=false so customers can compare configurations.
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          $ref: '#/components/responses/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags:
        - Profile
      operationId: getCurrentCustomerProfile
      x-prd-references:
        - US-C11
        - FR-10
      x-required-roles:
        - customer
      summary: Get the current customer profile
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Profile
      operationId: updateCurrentCustomerProfile
      x-prd-references:
        - US-C11
        - FR-10
      x-required-roles:
        - customer
      summary: Update the current customer profile and default shipping address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfilePatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart:
    get:
      tags:
        - Cart
      operationId: getCart
      x-prd-references:
        - US-C06
        - FR-CART-01
      x-required-roles:
        - customer
      summary: Read the current customer cart
      description: Reading the cart re-prices active items and revalidates the applied promotion. Cart items do not reserve inventory.
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/items:
    post:
      tags:
        - Cart
      operationId: addCartItem
      x-prd-references:
        - US-C06
        - FR-CART-01
        - BR-04
      x-required-roles:
        - customer
      summary: Add a variant to the current cart
      description: Adding the same variant increments its existing line quantity. The availability check is provisional and does not reserve stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OutOfStock'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/items/{itemId}:
    patch:
      tags:
        - Cart
      operationId: updateCartItem
      x-prd-references:
        - US-C06
        - FR-CART-01
        - BR-04
      x-required-roles:
        - customer
      summary: Change a cart item quantity
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OutOfStock'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Cart
      operationId: removeCartItem
      x-prd-references:
        - US-C06
        - FR-CART-01
      x-required-roles:
        - customer
      summary: Remove a cart item
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/promotion:
    put:
      tags:
        - Cart
      operationId: applyCartPromotion
      x-prd-references:
        - US-C07
        - FR-PROM-01
        - BR-03
      x-required-roles:
        - customer
      summary: Apply or replace the cart promotion code
      description: Codes are trimmed and matched case-insensitively. A cart holds at most one promotion; this operation replaces any existing code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPromotionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidPromotion'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Cart
      operationId: removeCartPromotion
      x-prd-references:
        - US-C07
        - FR-PROM-01
        - BR-03
      x-required-roles:
        - customer
      summary: Remove the cart promotion code
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /checkout:
    post:
      tags:
        - Checkout
      operationId: checkoutCart
      x-prd-references:
        - US-C08
        - FR-ORDR-01
        - BR-01
        - BR-02
        - BR-03
        - BR-04
      x-required-roles:
        - customer
      summary: Create an order from the current cart
      description: |
        The server verifies expectedCartVersion and acceptedGrandTotal, re-prices the cart, validates one optional promotion,
        conditionally decrements variant inventory, consumes promotion usage, creates an immutable Created order snapshot,
        stores the idempotency result, and clears the cart in one database transaction. Any failure rolls back every mutation.
        A repeated request with the same Idempotency-Key, customer, cart version, and payload returns the original response.
        Reusing the key with a different fingerprint returns IDEMPOTENCY_KEY_REUSED. Mock payment is a separate local-only action.
        The Created order retains its stock decrement and consumed promotion usage until mock payment succeeds or an administrator cancels it; this MVP has no automatic expiry.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders:
    get:
      tags:
        - Orders
      operationId: listOwnOrders
      x-prd-references:
        - US-C09
        - US-C10
        - FR-ORDR-02
      x-required-roles:
        - customer
      summary: List orders owned by the current customer
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOwnOrder
      x-prd-references:
        - US-C09
        - US-C10
        - FR-ORDR-02
      x-required-roles:
        - customer
      summary: Get an order owned by the current customer
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}/mock-payment:
    post:
      tags:
        - Checkout
      operationId: simulateOrderPayment
      x-prd-references:
        - US-C08
        - FR-ORDR-01
      x-development-only: true
      x-required-roles:
        - customer
      summary: Simulate payment for an owned Created order
      description: |
        Local demo endpoint only. An approved result moves Created to Paid. A declined result leaves the order Created, including its inventory and promotion hold, so payment may be retried or an administrator may cancel the order.
        Replaying the same Idempotency-Key for the same customer, order, and result returns the original response. Reusing that key with another order or result returns IDEMPOTENCY_KEY_REUSED.
        No real payment credentials, card data, or external gateway are accepted.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/MockPayment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MockPaymentConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/dashboard/summary:
    get:
      tags:
        - Admin Dashboard
      operationId: getAdminDashboardSummary
      x-prd-references:
        - US-A01
        - FR-ADMN-01
      x-prd-priority: could-have
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - dashboard:read
      summary: Get an operational dashboard summary
      description: Projected revenue includes Paid, Shipped, and Completed orders only and is not financial settlement data.
      responses:
        '200':
          $ref: '#/components/responses/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/categories:
    get:
      tags:
        - Admin Catalog
      operationId: listAdminCategories
      x-prd-references:
        - US-A03
      summary: List all categories including inactive records
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      responses:
        '200':
          $ref: '#/components/responses/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Admin Catalog
      operationId: createCategory
      x-prd-references:
        - US-A03
      summary: Create a category
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/categories/{categoryId}:
    patch:
      tags:
        - Admin Catalog
      operationId: updateCategory
      x-prd-references:
        - US-A03
      summary: Update a category
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Admin Catalog
      operationId: deleteCategory
      x-prd-references:
        - US-A03
      summary: Delete an unused category
      description: A category that still has products cannot be deleted.
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/products:
    get:
      tags:
        - Admin Catalog
      operationId: listAdminProducts
      x-prd-references:
        - US-A02
        - US-A08
        - FR-ADMN-02
        - FR-ADMN-03
      summary: List products for administration
      description: Search includes active and inactive products. sort=relevance requires q; when sort is omitted, q uses relevance then product ID and an empty q uses newest then product ID.
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CategoryIdFilter'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Admin Catalog
      operationId: createProduct
      x-prd-references:
        - US-A02
        - FR-ADMN-02
        - BR-05
        - BR-07
      summary: Create a product and its initial variants
      description: |
        Initial variants start with zero inventory. Inventory is changed only through the inventory endpoint.
        An active product requires at least one active variant and exactly one thumbnail image; the request schema rejects violations with 400 VALIDATION_FAILED.
        At most one image may be the thumbnail. Setting isThumbnail=true atomically demotes the previous thumbnail.
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/ProductDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/products/{productId}:
    get:
      tags:
        - Admin Catalog
      operationId: getAdminProduct
      x-prd-references:
        - US-A02
        - FR-ADMN-02
        - FR-ADMN-03
      summary: Get any product for administration, including inactive products
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          $ref: '#/components/responses/ProductDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Admin Catalog
      operationId: updateProduct
      x-prd-references:
        - US-A02
        - FR-ADMN-03
        - BR-05
        - BR-07
      summary: Update product metadata or publication status
      description: Variants, images, and inventory are managed by their dedicated endpoints. Activating a product requires at least one active variant and exactly one thumbnail image.
      security:
        - bearerAuth: []
      x-required-roles:
        - admin
      x-required-permissions:
        - catalog:manage
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
