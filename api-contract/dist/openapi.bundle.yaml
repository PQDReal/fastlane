openapi: 3.1.0
info:
  title: Fastlane E-Commerce API
  version: 0.5.0-draft
  summary: Contract-first REST API for the Fastlane B2C MVP
  description: |
    Week-1 API contract aligned with PRD Fastlane E-Commerce v1.0.0.
    This artifact defines the integration boundary before backend, storefront, admin, database, and infrastructure work are merged.
    All money values are non-negative whole-VND strings. Pricing, option compatibility, deposit schedules, promotion eligibility, and inventory are calculated on the server.
    Catalog content is available only in vi-VN. UI and error messages are localized by the client from stable error codes.
    Authentication and registration use Auth0 Universal Login; this API does not duplicate Auth0 login, registration, or logout endpoints.
  license:
    name: Internal training use only
    identifier: LicenseRef-Internal-Training
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service health and readiness.
  - name: Catalog
    description: Public VinFast product discovery, category filtering, and detail.
  - name: Profile
    description: Current authenticated customer profile and default shipping address.
  - name: Cart
    description: Current authenticated customer cart and one optional promotion code.
  - name: Checkout
    description: Transactional order creation and local-only mock payment.
  - name: Orders
    description: Current customer order history and status tracking.
  - name: Pre-purchase
    description: Public single-location test-drive requests, consultation leads, and advisory cost estimates.
  - name: Admin Dashboard
    description: Optional MVP operational summary for the admin panel.
  - name: Admin Catalog
    description: Category, product, variant, image, price, and inventory administration.
  - name: Admin Promotions
    description: Promotion campaign administration.
  - name: Admin Orders
    description: Order search, fulfilment detail, and forward-only state transitions.
  - name: Admin Pre-purchase
    description: Single test-drive location, request operations, and versioned estimate policies.
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      security: []
      summary: Readiness check
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories:
    get:
      tags:
        - Catalog
      operationId: listCategories
      x-prd-references:
        - US-C02
        - US-C05
        - FR-PROD-02
      security: []
      summary: List active categories
      responses:
        '200':
          $ref: '#/components/responses/CategoryList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products:
    get:
      tags:
        - Catalog
      operationId: listProducts
      x-prd-references:
        - US-C02
        - US-C04
        - US-C05
        - FR-PROD-02
        - FR-PROD-03
      security: []
      summary: Search and browse active products
      description: |
        Full-text search matches Vietnamese product name, SKU, and description case-insensitively.
        Only active products are returned. Public detail exposes active variants only; an active out-of-stock variant remains visible with isPurchasable=false.
        Category and inclusive price filters may be combined. minPrice must not exceed maxPrice. Price filters, sorting, and priceRange use effective prices of active variants.
        When q is present and sort is omitted, results use relevance then product ID. Otherwise results use newest then product ID.
        sort=relevance requires q; without q it returns VALIDATION_FAILED.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/MinimumPrice'
        - $ref: '#/components/parameters/MaximumPrice'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{slug}:
    get:
      tags:
        - Catalog
      operationId: getProductBySlug
      x-prd-references:
        - US-C03
        - FR-PROD-01
      security: []
      summary: Get an active product by slug
      description: Returns active variants only. Out-of-stock active variants remain visible with isPurchasable=false so customers can compare configurations.
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          $ref: '#/components/responses/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /test-drive/availability:
    get:
      tags:
        - Pre-purchase
      operationId: getTestDriveAvailability
      x-prd-references:
        - BR-TD-005
        - BR-TD-006
        - BR-SHW-004
      summary: List available test-drive slots for the single configured location
      description: The location is server-owned and returned with the slots. The client supplies a product but never selects or submits a showroom identifier. REQUESTED records do not consume capacity; only CONFIRMED appointments do.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdQuery'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/TestDriveAvailability'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/PrepurchaseBusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /test-drive/requests:
    post:
      tags:
        - Pre-purchase
      operationId: createTestDriveRequest
      x-prd-references:
        - BR-TD-001
        - BR-TD-002
        - BR-TD-004
        - BR-TD-007
        - BR-TD-008
        - BR-TD-009
        - BR-TD-017
      summary: Request a preferred test-drive time as a guest or customer
      description: |
        Creates REQUESTED, not CONFIRMED. The server revalidates the one configured location, supported product, slot, blackout, and current confirmed capacity.
        The same normalized phone, product, and local date cannot have another active REQUESTED or CONFIRMED request. No driving-licence or identity-document image is accepted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestDriveRequest'
      responses:
        '201':
          $ref: '#/components/responses/TestDriveRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/TestDriveConflict'
        '422':
          $ref: '#/components/responses/PrepurchaseBusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /consultation-requests:
    post:
      tags:
        - Pre-purchase
      operationId: createConsultationRequest
      x-prd-references:
        - BR-LEAD-001
        - BR-LEAD-002
        - BR-LEAD-003
      summary: Submit a pre-purchase consultation request
      description: Guest access is allowed. Product and option identifiers carry context only; the server never trusts a client-supplied price or discount.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsultationRequest'
      responses:
        '201':
          $ref: '#/components/responses/ConsultationRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/PrepurchaseBusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /estimates/on-road:
    post:
      tags:
        - Pre-purchase
      operationId: calculateOnRoadEstimate
      x-prd-references:
        - BR-EST-001
        - BR-EST-002
        - BR-EST-003
        - BR-EST-004
        - BR-EST-005
        - BR-EST-007
        - BR-EST-010
        - BR-EST-011
        - BR-EST-012
      summary: Calculate a public on-road cost estimate
      description: |
        Calculates authoritative catalog price plus options minus one eligible promotion, then adds effective mandatory and selected optional fee policies for the registration province.
        VAT is never added twice. A missing mandatory policy fails the calculation instead of silently using zero. The result is advisory, versioned, and is not a quotation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnRoadEstimateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OnRoadEstimate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/EstimateUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /estimates/installment:
    post:
      tags:
        - Pre-purchase
      operationId: calculateInstallmentEstimate
      x-prd-references:
        - BR-LN-001
        - BR-LN-003
        - BR-LN-004
        - BR-LN-005
        - BR-LN-006
        - BR-LN-007
      summary: Calculate an advisory declining-balance installment schedule
      description: |
        The finance base is the vehicle price after discount from the referenced current on-road calculation; registration and optional fees remain due up front.
        MVP uses equal principal, monthly interest on opening principal, whole-VND half-up rounding, and a final-period principal reconciliation. The result is not credit approval.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentEstimateRequest'
      responses:
        '200':
          $ref: '#/components/responses/InstallmentEstimate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EstimateConflict'
        '422':
          $ref: '#/components/responses/EstimateUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags:
        - Profile
      operationId: getCurrentCustomerProfile
      x-prd-references:
        - US-C11
        - FR-10
      x-required-roles:
        - customer
      summary: Get the current customer profile
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Profile
      operationId: updateCurrentCustomerProfile
      x-prd-references:
        - US-C11
        - FR-10
      x-required-roles:
        - customer
      summary: Update the current customer profile and default shipping address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfilePatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart:
    get:
      tags:
        - Cart
      operationId: getCart
      x-prd-references:
        - US-C06
        - FR-CART-01
      x-required-roles:
        - customer
      summary: Read the current customer cart
      description: Reading the cart re-prices active variants and selected options, recalculates deposit amounts, and revalidates the applied promotion. Cart items do not reserve inventory.
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/items:
    post:
      tags:
        - Cart
      operationId: addCartItem
      x-prd-references:
        - US-C06
        - FR-CART-01
        - BR-04
        - BR-13
      x-required-roles:
        - customer
      summary: Add a variant to the current cart
      description: The server validates option ownership, group cardinality, active state, uniqueness, and variant-SKU compatibility. Adding the same variant with the same option selection increments its existing line quantity; a different selection creates another line. The availability check is provisional and does not reserve stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OutOfStock'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/items/{itemId}:
    patch:
      tags:
        - Cart
      operationId: updateCartItem
      x-prd-references:
        - US-C06
        - FR-CART-01
        - BR-04
        - BR-13
      x-required-roles:
        - customer
      summary: Change a cart item quantity
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OutOfStock'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Cart
      operationId: removeCartItem
      x-prd-references:
        - US-C06
        - FR-CART-01
      x-required-roles:
        - customer
      summary: Remove a cart item
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/promotion:
    put:
      tags:
        - Cart
      operationId: applyCartPromotion
      x-prd-references:
        - US-C07
        - FR-PROM-01
        - BR-03
      x-required-roles:
        - customer
      summary: Apply or replace the cart promotion code
      description: Codes are trimmed and matched case-insensitively. A cart holds at most one promotion; this operation replaces any existing code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPromotionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidPromotion'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Cart
      operationId: removeCartPromotion
      x-prd-references:
        - US-C07
        - FR-PROM-01
        - BR-03
      x-required-roles:
        - customer
      summary: Remove the cart promotion code
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /checkout:
    post:
      tags:
        - Checkout
      operationId: checkoutCart
      x-prd-references:
        - US-C08
        - FR-ORDR-01
        - BR-01
        - BR-02
        - BR-03
        - BR-04
        - BR-13
        - BR-14
      x-required-roles:
        - customer
      summary: Create an order from the current cart
      description: |
        The server verifies the selected cartItemIds, expectedCartVersion, acceptedGrandTotal, and acceptedAmountDueNow; re-prices selected variants and options; validates one optional promotion,
        conditionally decrements variant inventory, consumes promotion usage, creates an immutable Created order snapshot,
        stores the idempotency result, and clears the cart in one database transaction. Any failure rolls back every mutation.
        A repeated request with the same Idempotency-Key, customer, cart version, and payload returns the original response.
        Reusing the key with a different fingerprint returns IDEMPOTENCY_KEY_REUSED. Mock payment is a separate local-only action.
        The Created order retains its stock decrement and consumed promotion usage until payment, cancellation, or automatic expiry at initialPaymentDueAt.
        Pricing snapshots grandTotal, amountDueNow, and balanceDue. The initial payment charges amountDueNow only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders:
    get:
      tags:
        - Orders
      operationId: listOwnOrders
      x-prd-references:
        - US-C09
        - US-C10
        - FR-ORDR-02
      x-required-roles:
        - customer
      summary: List orders owned by the current customer
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOwnOrder
      x-prd-references:
        - US-C09
        - US-C10
        - FR-ORDR-02
      x-required-roles:
        - customer
      summary: Get an order owned by the current customer
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}/cancellation:
    post:
      tags:
        - Orders
      operationId: cancelOwnOrder
      x-prd-references:
        - US-C09
        - FR-ORDR-02
        - BR-15
        - BR-16
      x-required-roles:
        - customer
      summary: Cancel an owned order within its snapshotted cancellation policy
      description: |
        The server verifies expectedCurrentStatus and the order-level cancellation-policy snapshot, calculates the refundable amount,
        restores inventory and promotion usage exactly once, records the customer cancellation, and creates a pending refund when required.
        A repeated request with the same Idempotency-Key, customer, order, and payload returns the original response.
        Reusing the key with a different fingerprint returns IDEMPOTENCY_KEY_REUSED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CancellationConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}/mock-payment:
    post:
      tags:
        - Checkout
      operationId: simulateOrderPayment
      x-prd-references:
        - US-C08
        - FR-ORDR-01
        - BR-12
        - BR-14
      x-development-only: true
      x-required-roles:
        - customer
      summary: Simulate payment for an owned Created order
      description: |
        Local demo endpoint only. For Created, an approved result charges amountDueNow and moves the order to DepositPaid when balanceDue remains, otherwise to Paid. For DepositPaid, including BalanceOverdue within grace, approval charges the current balanceDue and moves the order to Paid. A declined result charges zero, records a failed charge transaction, and preserves the current order/payment state.
        Replaying the same Idempotency-Key for the same customer, order, and result returns the original response. Reusing that key with another order or result returns IDEMPOTENCY_KEY_REUSED.
        No real payment credentials, card data, or external gateway are accepted.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/MockPayment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MockPaymentConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}/mock-refund:
    post:
      tags:
        - Checkout
      operationId: simulateOrderRefund
      x-prd-references:
        - US-C09
        - FR-ORDR-02
        - BR-16
      x-development-only: true
      x-required-roles:
        - customer
      summary: Simulate a pending refund for an owned cancelled order
      description: |
        Local demo endpoint only. Approved marks the pending refundable amount as refunded and records a successful refund transaction.
        Declined marks the refund failed without changing amountPaid, allowing a later retry with a new Idempotency-Key.
        Replaying the same Idempotency-Key for the same customer, order, and result returns the original response.
        Reusing that key with another order or result returns IDEMPOTENCY_KEY_REUSED. No real payment credentials are accepted.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockRefundRequest'
