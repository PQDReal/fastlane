        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Auth0 RS256 JWT access token for this API. Deployment configuration supplies issuer, audience, JWKS URI, and namespaced roles claim.
        The backend validates signature, iss, aud, exp, role, permissions, and resource ownership. ID tokens are not accepted as API credentials.
  parameters:
    Query:
      name: q
      in: query
      description: Trimmed free-text query. Empty or whitespace-only values are invalid when supplied.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: ^[a-z0-9-]+$
    MinimumPrice:
      name: minPrice
      in: query
      description: Inclusive minimum effective active-variant price. Must not exceed maxPrice when both are supplied.
      schema:
        $ref: '#/components/schemas/Money'
    MaximumPrice:
      name: maxPrice
      in: query
      description: Inclusive maximum effective active-variant price. Must be greater than or equal to minPrice when both are supplied.
      schema:
        $ref: '#/components/schemas/Money'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: relevance requires q. If omitted, q uses relevance and requests without q use newest.
      schema:
        type: string
        enum:
          - relevance
          - newest
          - price_asc
          - price_desc
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 220
        pattern: ^[a-z0-9-]+$
    ProductIdQuery:
      name: productId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DateFrom:
      name: dateFrom
      in: query
      description: Inclusive local calendar date in the single location timezone. Must not exceed dateTo.
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      description: Inclusive local calendar date in the single location timezone. Must not be earlier than dateFrom.
      schema:
        type: string
        format: date
    CartItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key, retained for at least 24 hours for this customer and endpoint.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: ^[A-Za-z0-9._:-]+$
    OrderStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/OrderStatus'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CategoryIdFilter:
      name: categoryId
      in: query
      schema:
        $ref: '#/components/schemas/Uuid'
    IsActive:
      name: isActive
      in: query
      schema:
        type: boolean
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProductImageId:
      name: imageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CreatedFrom:
      name: createdFrom
      in: query
      description: Inclusive RFC 3339 lower bound. Must not be later than createdTo when both are supplied.
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      description: Inclusive RFC 3339 upper bound. Must not be earlier than createdFrom when both are supplied.
      schema:
        type: string
        format: date-time
    OrderSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - created_asc
          - status_asc
        default: created_desc
    TestDriveStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/TestDriveRequestStatus'
    PrepurchaseRequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConsultationStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ConsultationStatus'
    FeePolicyId:
      name: feePolicyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LoanPackageId:
      name: loanPackageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    TooManyRequests:
      description: Rate limit exceeded.
      x-error-codes:
        - RATE_LIMIT_EXCEEDED
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds before retrying.
        X-RateLimit-Limit:
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Reset:
          schema:
            type: integer
            minimum: 0
          description: Unix epoch seconds when the window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Rate limit exceeded.
              requestId: req_01J00000000000000000000000
    InternalServerError:
      description: Unexpected server error. Internal details are not exposed.
      x-error-codes:
        - INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected server error.
              requestId: req_01J00000000000000000000000
    CategoryList:
      description: Category list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CategoryListResponse'
    ProductPage:
      description: Product page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductPageResponse'
    ValidationError:
      description: Request syntax, parameters, or schema are invalid.
      x-error-codes:
        - VALIDATION_FAILED
        - DATE_RANGE_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_FAILED
              message: Request validation failed.
              requestId: req_01J00000000000000000000000
              fields:
                - path: shippingAddress.phoneNumber
                  code: INVALID_PHONE
    ProductDetail:
      description: Product detail
      content:
        application/json:
          schema:
