      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ORDER_TRANSITION
              message: Order transition is not allowed.
              requestId: req_01J00000000000000000000000
    TestDriveRequestPage:
      description: Paginated test-drive requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestDriveRequestPageResponse'
    TestDriveSettings:
      description: Singleton test-drive location and schedule settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestDriveSettingsResponse'
    PolicyConflict:
      description: A policy/settings version is stale or overlaps an existing effective version.
      x-error-codes:
        - POLICY_VERSION_CONFLICT
        - SETTINGS_VERSION_CONFLICT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: POLICY_VERSION_CONFLICT
              message: Policy version conflicts with current state.
              requestId: req_01J00000000000000000000000
    ConsultationRequestPage:
      description: Paginated consultation requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsultationRequestPageResponse'
    PrepurchaseTransitionConflict:
      description: The expected consultation state does not match or the transition is invalid.
      x-error-codes:
        - INVALID_CONSULTATION_TRANSITION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CONSULTATION_TRANSITION
              message: Consultation transition is not allowed.
              requestId: req_01J00000000000000000000000
    FeePolicyPage:
      description: Paginated fee policies
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeePolicyPageResponse'
    FeePolicy:
      description: Versioned on-road fee policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeePolicyResponse'
    LoanPackagePage:
      description: Paginated installment packages
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoanPackagePageResponse'
    LoanPackage:
      description: Versioned installment package
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoanPackageResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - ok
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - DATE_RANGE_INVALID
        - AUTHENTICATION_REQUIRED
        - INVALID_ACCESS_TOKEN
        - INSUFFICIENT_PERMISSION
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - CATEGORY_IN_USE
        - DUPLICATE_CATEGORY_SLUG
        - DUPLICATE_PRODUCT_SLUG
        - DUPLICATE_SKU
        - DUPLICATE_PROMOTION_CODE
        - PRODUCT_NOT_PURCHASABLE
        - PRODUCT_CONFIGURATION_INVALID
        - ORDER_CANCELLATION_NOT_ALLOWED
        - PAYMENT_DEADLINE_EXPIRED
        - REFUND_NOT_ALLOWED
        - CART_EMPTY
        - CART_CHANGED
        - PRICE_CHANGED
        - OUT_OF_STOCK
        - PROMOTION_INVALID
        - PROMOTION_INACTIVE
        - PROMOTION_NOT_STARTED
        - PROMOTION_EXPIRED
        - PROMOTION_MINIMUM_NOT_MET
        - PROMOTION_USAGE_LIMIT_REACHED
        - IDEMPOTENCY_KEY_REUSED
        - INVENTORY_VERSION_CONFLICT
        - INVALID_ORDER_TRANSITION
        - TEST_DRIVE_SLOT_UNAVAILABLE
        - DUPLICATE_TEST_DRIVE_REQUEST
        - INVALID_TEST_DRIVE_TRANSITION
        - TEST_DRIVE_LOCATION_UNAVAILABLE
        - TEST_DRIVE_PRODUCT_UNAVAILABLE
        - INVALID_CONSULTATION_TRANSITION
        - ESTIMATE_POLICY_UNAVAILABLE
        - LOAN_PACKAGE_UNAVAILABLE
        - ESTIMATE_STALE
        - POLICY_VERSION_CONFLICT
        - SETTINGS_VERSION_CONFLICT
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMIT_EXCEEDED
        - INTERNAL_ERROR
    ValidationFieldCode:
      type: string
      enum:
        - REQUIRED
        - UNKNOWN_FIELD
        - INVALID_FORMAT
        - INVALID_VALUE
        - INVALID_PHONE
        - OUT_OF_RANGE
        - TOO_SHORT
        - TOO_LONG
    ErrorField:
      type: object
      additionalProperties: false
      required:
        - path
        - code
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 200
          example: shippingAddress.phoneNumber
        code:
          $ref: '#/components/schemas/ValidationFieldCode'
        meta:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Safe presentation-neutral diagnostic; client localizes user-facing text from code.
            requestId:
              type: string
              minLength: 1
              maxLength: 100
            fields:
              type: array
              items:
                $ref: '#/components/schemas/ErrorField'
            meta:
              type: object
              additionalProperties: true
    Uuid:
      type: string
      format: uuid
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 160
        isActive:
          type: boolean
    CategoryListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Money:
      type: string
      pattern: ^(0|[1-9]\d*)$
      examples:
        - '199000'
      description: Non-negative whole-VND amount encoded as a base-10 string to avoid floating-point loss.
    ProductKind:
      type: string
      enum:
        - car
        - motorbike
        - accessory
      description: Stable business discriminator; category remains the mutable merchandising taxonomy.
    PurchaseMode:
      type: string
      enum:
        - full
        - deposit
    CancellationCutoff:
      type: string
      enum:
        - before_initial_payment
        - before_balance_due
        - before_shipping
    CancellationPolicy:
      type: object
      additionalProperties: false
      required:
        - customerCancellationAllowed
        - customerCancellationCutoff
        - refundPercentage
        - overdueRefundPercentage
        - cancellationFeeAmount
      properties:
        customerCancellationAllowed:
          type: boolean
        customerCancellationCutoff:
          allOf:
            - $ref: '#/components/schemas/CancellationCutoff'
          description: before_balance_due is valid only for deposit products; backend enforces the cross-field rule.
        refundPercentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of gross paid amount refundable for an allowed cancellation before overdue auto-cancellation.
        overdueRefundPercentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage used when a deposit order is auto-cancelled after its grace period.
        cancellationFeeAmount:
          $ref: '#/components/schemas/Money'
    PositiveMoney:
      type: string
      pattern: ^[1-9]\d*$
      examples:
        - '199000'
      description: Strictly positive whole-VND amount.
    PurchaseTerms:
      description: Product-level payment, deadline, grace-period, cancellation, and refund policy. Order items snapshot this object at checkout.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - paymentMode
            - depositAmount
            - initialPaymentWindowMinutes
            - balancePaymentWindowDays
            - gracePeriodHours
            - cancellationPolicy
          properties:
            paymentMode:
              allOf:
                - $ref: '#/components/schemas/PurchaseMode'
              const: full
            depositAmount:
              type: 'null'
            initialPaymentWindowMinutes:
              type: integer
              minimum: 5
              maximum: 1440
            balancePaymentWindowDays:
              type: 'null'
            gracePeriodHours:
              type: 'null'
            cancellationPolicy:
              $ref: '#/components/schemas/CancellationPolicy'
        - type: object
          additionalProperties: false
          required:
            - paymentMode
            - depositAmount
            - initialPaymentWindowMinutes
            - balancePaymentWindowDays
            - gracePeriodHours
            - cancellationPolicy
          properties:
            paymentMode:
              allOf:
                - $ref: '#/components/schemas/PurchaseMode'
              const: deposit
            depositAmount:
              $ref: '#/components/schemas/PositiveMoney'
            initialPaymentWindowMinutes:
              type: integer
              minimum: 5
              maximum: 1440
            balancePaymentWindowDays:
              type: integer
              minimum: 1
              maximum: 365
              description: Measured from successful initial deposit payment.
            gracePeriodHours:
              type: integer
              minimum: 0
              maximum: 720
            cancellationPolicy:
              $ref: '#/components/schemas/CancellationPolicy'
    PriceRange:
      type: object
      additionalProperties: false
      description: Minimum and maximum base effective prices across active variants before dynamic option adjustments; active out-of-stock variants are included.
      required:
        - minimum
        - maximum
        - currency
      properties:
        minimum:
          $ref: '#/components/schemas/PositiveMoney'
        maximum:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          enum:
            - VND
    ProductSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - productKind
        - purchaseTerms
        - category
        - thumbnailUrl
        - priceRange
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 220
        productKind:
          $ref: '#/components/schemas/ProductKind'
        purchaseTerms:
          $ref: '#/components/schemas/PurchaseTerms'
        category:
          $ref: '#/components/schemas/Category'
        thumbnailUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
          description: Non-null for public active products; may be null in admin draft results.
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        isActive:
          type: boolean
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProductPageResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ProductImage:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - altText
        - sortOrder
        - isThumbnail
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
          maxLength: 2048
        altText:
          type: string
          minLength: 1
          maxLength: 255
        sortOrder:
          type: integer
          minimum: 0
        isThumbnail:
          type: boolean
    ProductSpecification:
      type: object
      additionalProperties: false
      required:
        - name
        - value
        - sortOrder
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Công suất tối đa
        value:
          type: string
          minLength: 1
          maxLength: 500
          example: '150'
        unit:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 40
              example: kW
            - type: 'null'
        group:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
              example: Động cơ
            - type: 'null'
        sortOrder:
          type: integer
          minimum: 0
    BatteryOption:
      type: string
      enum:
        - included
        - purchase
        - subscription
      description: included means no battery choice is required; purchase and subscription are explicit customer acquisition choices.
    Price:
      type: object
      additionalProperties: false
      required:
        - currency
        - listPrice
        - effectivePrice
      properties:
        currency:
          type: string
          enum:
            - VND
        listPrice:
          $ref: '#/components/schemas/PositiveMoney'
        salePrice:
          description: When present, must be lower than listPrice.
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        effectivePrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          readOnly: true
          description: salePrice when present; otherwise listPrice.
    Variant:
      type: object
      additionalProperties: false
      required:
        - id
        - sku
        - attributes
        - batteryOption
        - price
        - availableQuantity
        - inventoryVersion
        - isActive
        - isPurchasable
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sku:
          type: string
          minLength: 1
          maxLength: 80
        attributes:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          examples:
            - color: Black
              trim: Plus
        batteryOption:
          description: Typed battery acquisition mode for electric vehicles; null for products where it does not apply.
          oneOf:
            - $ref: '#/components/schemas/BatteryOption'
            - type: 'null'
        price:
          $ref: '#/components/schemas/Price'
        availableQuantity:
          type: integer
          minimum: 0
          readOnly: true
        inventoryVersion:
          type: integer
          minimum: 0
          readOnly: true
        isActive:
          type: boolean
        isPurchasable:
          type: boolean
