<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastlane Presentation</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .slide-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Embed Google Slides -->
        <iframe 
            src="https://docs.google.com/presentation/d/1gesH4Cow7Sl5-jDwHya_Ye2p9od_sREPQJv63UMSbeQ/embed?start=false&loop=false&delayms=3000" 
            frameborder="0" 
            width="960" 
            height="569" 
            allowfullscreen="true" 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true">
        </iframe>
    </div>
</body>
</html>
